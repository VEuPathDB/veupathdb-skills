name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: zip -r veupathdb_database.zip veupathdb_database -x '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*'
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" veupathdb_database.zip --clobber
