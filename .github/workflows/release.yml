name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: zip -r "veupathdb_database-$TAG.zip" veupathdb_database -x '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*' 'veupathdb_database/tests/*' veupathdb_database/TESTS.md
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "veupathdb_database-$TAG.zip" --clobber
